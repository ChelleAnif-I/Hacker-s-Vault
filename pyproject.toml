[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hackers-vault"
version = "0.1.0"
description = "Hacker's Vault — a console hacking game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame>=2.6.0",
]

[project.scripts]
hackers-vault = "hackers_vault:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
